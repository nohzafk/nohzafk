name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate language activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          user: nohzafk
          template: classic
          base: ""
          config_display: regular
          config_order: notable, isocalendar, languages
          extras_css: |
            /* Breathing room between widgets. The languages plugin emits its
               header and its bar body as two sibling sections (`section.column`),
               so that pair keeps its original tight 2px gap. */
            .items-wrapper > section + section:not(.column) {
              margin-top: 16px;
            }
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: pull_request
          plugin_notable_repositories: yes
          repositories_forks: no
          plugins_errors_fatal: yes
